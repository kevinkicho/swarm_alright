name: go-swarm

on:
  push:
    paths:
      - "go-swarm/**"
      - ".github/workflows/go.yml"
      - "fixtures/eval/**"
  pull_request:
    paths:
      - "go-swarm/**"
      - ".github/workflows/go.yml"
      - "fixtures/eval/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-swarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: go-swarm/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -o swarm .
