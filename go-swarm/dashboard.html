<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>swarm dashboard</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #c0c0c0; margin: 0; padding: 20px; }
  h1 { color: #36d1dc; }
  .header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
  .status { padding: 4px 12px; border-radius: 4px; font-size: 14px; }
  .alive { background: #1a4a2a; color: #4ade80; }
  .crashed { background: #4a1a1a; color: #f87171; }
  .stopped { background: #2a2a2a; color: #888; }
  .card { background: #16213e; border: 1px solid #233; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; color: #36d1dc; font-size: 16px; }
  .kv { display: flex; gap: 8px; margin: 4px 0; }
  .kv .k { color: #666; width: 120px; }
  .kv .v { color: #c0c0c0; }
  #log { white-space: pre-wrap; max-height: 400px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
  .log-cycle { color: #36d1dc; }
  .log-tool { color: #fbbf24; }
  .log-error { color: #f87171; }
  .log-accept { color: #4ade80; }
  #events { white-space: pre-wrap; max-height: 300px; overflow-y: auto; font-size: 12px; }
  a { color: #36d1dc; }
</style>
</head>
<body>
<h1>swarm dashboard</h1>
<div id="app"></div>
<div class="card">
  <h2>events.log (live)</h2>
  <div id="log">connecting...</div>
</div>

<script>
const poll = async () => {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    const el = document.getElementById('app');
    let html = '';
    if (data.run) {
      const r = data.run;
      const cls = r.effective_status === 'alive' ? 'alive' : r.effective_status === 'crashed' ? 'crashed' : 'stopped';
      html += '<div class="header">';
      html += '<span class="status ' + cls + '">' + r.effective_status + '</span>';
      html += '<h1 style="margin:0">run ' + r.id + '</h1>';
      html += '</div>';
      html += '<div class="card"><h2>run state</h2>';
      html += kv('cycle', r.cycle);
      html += kv('phase', r.phase);
      html += kv('project', r.project);
      html += kv('models', 'system=' + r.models.system + ' worker=' + r.models.worker);
      html += kv('directive', r.directive || '(inferred)');
      if (r.agents) {
        for (const a of r.agents) {
          html += kv(a.role, a.sessionid.slice(0,16) + '... model=' + a.model);
        }
      }
      html += '</div>';
    } else {
      html += '<p>no active runs</p>';
    }
    el.innerHTML = html;
  } catch (e) {
    document.getElementById('app').innerHTML = '<p style="color:#f87171">error: ' + e.message + '</p>';
  }
};

function kv(k, v) {
  return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}

// SSE for live log
const evtSource = new EventSource('/api/events');
const logEl = document.getElementById('log');
let logLines = [];
evtSource.onmessage = (e) => {
  const line = JSON.parse(e.data);
  let cls = '';
  if (line.text.includes('===')) cls = 'log-cycle';
  else if (line.text.includes('[tool]')) cls = 'log-tool';
  else if (line.text.includes('[error]') || line.text.includes('failed')) cls = 'log-error';
  else if (line.text.includes('ACCEPT')) cls = 'log-accept';
  logLines.push('<div class="' + cls + '">' + escapeHtml(line.text) + '</div>');
  if (logLines.length > 200) logLines.shift();
  logEl.innerHTML = logLines.join('');
  logEl.scrollTop = logEl.scrollHeight;
};

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
